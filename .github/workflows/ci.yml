name: CI Voluntia
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: voluntia
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: voluntia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voluntia -d voluntia_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ['1025:1025', '8025:8025']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://voluntia:local_ci_only@localhost:5432/voluntia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: voluntia
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: voluntia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voluntia -d voluntia_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ['1025:1025', '8025:8025']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://voluntia:local_ci_only@localhost:5432/voluntia_test
      DATABASE_URL: postgresql+psycopg://voluntia:local_ci_only@localhost:5432/voluntia_test
      JWT_SECRET: ephemeral-ci-only-secret-not-valid-outside-this-disposable-runner
      APP_ENV: test
      PUBLIC_BASE_URL: http://localhost:8000
      E2E_BASE_URL: http://localhost:8000
      E2E_PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24.21.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - run: python -m alembic -c backend/alembic.ini upgrade head
      - run: python -m scripts.e2e_seed
      - run: |
          python -m uvicorn backend.app.main:app --host 127.0.0.1 --port 8000 > .local/server.log 2>&1 &
          python -m scripts.wait_ready http://localhost:8000/api/ready
      - run: npx playwright test
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: integration-failure
          path: |
            frontend/playwright-report
            frontend/test-results
            .local/server.log
