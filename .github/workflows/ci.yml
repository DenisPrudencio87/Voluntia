name: CI Voluntia
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: voluntia
          POSTGRES_PASSWORD: local_ci_only
          POSTGRES_DB: voluntia_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U voluntia -d voluntia_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
      mailpit:
        image: axllent/mailpit:v1.27.8
        ports: ['1025:1025', '8025:8025']
    env:
      TEST_DATABASE_URL: postgresql+psycopg://voluntia:local_ci_only@localhost:5432/voluntia_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: python -m pytest backend/tests -q
